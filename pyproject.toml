[project]
name = "baebugs"
version = "0.1.0"
description = "USB-camera insect sizing (YOLO + classical consensus) -> sieve stack and water-flow plan for robot arms"
requires-python = ">=3.10"
dependencies = ["opencv-contrib-python-headless>=4.8", "numpy", "pyyaml"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
claude = ["anthropic"]
notebook = ["jupyter", "matplotlib"]
dev = ["pytest", "nbclient", "nbformat", "ipykernel"]

[project.scripts]
baebugs = "baebugs.cli:main"
baebugs-train = "baebugs.train:main"

[tool.setuptools.packages.find]
include = ["baebugs*"]

[tool.setuptools.package-data]
baebugs = ["config/*.yaml"]
