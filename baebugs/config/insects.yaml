# Size classes for the BioKEA bug analogs. PLACEHOLDERS from typical grain/pasta
# dimensions — replace with the insect parameters you provide. Units: mm.
# width_mm is the narrow axis and decides what passes square/round mesh.
classes:
  - {name: tiny,   width_mm: [0.3, 1.2], examples: [chia, quinoa, couscous]}
  - {name: small,  width_mm: [1.2, 2.2], examples: [white rice, brown rice, red rice, wild rice]}
  - {name: medium, width_mm: [2.2, 4.0], examples: [broken fideo, rice clumps]}
  - {name: large,  width_mm: [4.0, 30],  examples: [ditalini, lasagna shards]}
retention_margin: 1.10
